<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t="web.tytul">Dungeon - graphical edition</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2306070b'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f6f4ee'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23ffcd82' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="shell">
  <header id="hud">
    <section class="grupa zywotnosc" data-t-title="web.hud.grupa.zywotnosc">
      <div class="poz zycie" data-t-title="web.hud.tytul.zycie">
        <span class="rzad"><i class="ikona" data-ikona="serce"></i><span class="bar"><i id="hpfill"></i></span><span id="hptext" class="num">0/0</span></span>
        <em data-t="web.hud.zycie">life</em>
      </div>
      <div id="stany" class="stany"></div>
    </section>
    <section class="grupa postac" data-t-title="web.hud.grupa.postac">
      <div class="poz" data-t-title="web.hud.tytul.poziom"><i class="ikona" data-ikona="gwiazda"></i><span class="kol"><b id="plevel">1</b><em data-t="web.hud.poziom">level</em></span></div>
      <div class="poz dosw" data-t-title="web.hud.tytul.dosw"><i class="ikona" data-ikona="iskra"></i><span class="kol"><b><span id="pxp">0</span><small>/</small><span id="pxpprog">10</span></b><span class="bar mini"><i id="xpfill"></i></span><em data-t="web.hud.dosw">XP</em></span></div>
      <div class="poz" data-t-title="web.hud.tytul.atak"><i class="ikona" data-ikona="miecz"></i><span class="kol"><b id="patk">0</b><em data-t="web.hud.atak">attack</em></span></div>
      <div class="poz" data-t-title="web.hud.tytul.obrona"><i class="ikona" data-ikona="tarcza"></i><span class="kol"><b id="pdef">0</b><em data-t="web.hud.obrona">defense</em></span></div>
    </section>
    <section class="grupa loch" data-t-title="web.hud.grupa.loch">
      <div class="poz" data-t-title="web.hud.tytul.glebokosc"><i class="ikona" data-ikona="schody"></i><span class="kol"><b id="pdepth">1/8</b><em data-t="web.hud.glebokosc">depth</em></span></div>
      <div class="poz wrogowie" data-t-title="web.hud.tytul.wrogow"><i class="ikona" data-ikona="czaszka"></i><span class="kol"><b id="pwrogi">0</b><em data-t="web.hud.wrogow">foes</em></span></div>
      <div class="poz" data-t-title="web.hud.tytul.tura"><i class="ikona" data-ikona="klepsydra"></i><span class="kol"><b id="pturn">0</b><em data-t="web.hud.tura">turn</em></span></div>
    </section>
    <div class="right">
      <span id="trudnosc" class="tag" hidden></span>
      <span id="autotag" class="tag auto" data-t="web.autozapis" data-t-title="web.autozapisTytul">autosave</span>
      <span id="amulet" class="tag gold" hidden data-t="web.amulet">AMULET</span>
      <span id="jezyk" class="jezyk"></span>
    </div>
  </header>

  <main id="stage"><canvas id="map"></canvas></main>

  <footer id="foot">
    <ul id="log"></ul>
    <p id="hint"><span data-t-html="web.podpowiedz"></span><span id="podpis" hidden></span></p>
  </footer>
</div>

<div id="overlay" hidden>
  <div id="panel"></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
