<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loch - wersja graficzna</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2306070b'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f6f4ee'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23ffcd82' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="shell">
  <header id="hud">
    <div class="hp">
      <span class="lbl">HP</span>
      <div class="bar"><i id="hpfill"></i></div>
      <span id="hptext" class="num">0/0</span>
    </div>
    <div class="stats">
      <span><b id="plevel">1</b><em>poziom</em></span>
      <span><b id="pxp">0</b><em>dośw.</em></span>
      <span><b id="patk">0</b><em>atak</em></span>
      <span><b id="pdef">0</b><em>obrona</em></span>
      <span><b id="pdepth">1/8</b><em>głębokość</em></span>
      <span><b id="pwrogi">0</b><em>wrogów tu</em></span>
      <span><b id="pturn">0</b><em>tura</em></span>
    </div>
    <div class="right">
      <span id="autotag" class="tag auto" title="Gra zapisuje się sama - odświeżenie strony nie resetuje rozgrywki">autozapis</span>
      <span id="hunger" class="tag">syty</span>
      <span id="amulet" class="tag gold" hidden>AMULET</span>
    </div>
  </header>

  <main id="stage"><canvas id="map"></canvas></main>

  <footer id="foot">
    <ul id="log"></ul>
    <p id="hint">? zasady &nbsp;·&nbsp; i ekwipunek &nbsp;·&nbsp; w powąchaj &nbsp;·&nbsp; , podnieś &nbsp;·&nbsp; &gt; &lt; schody &nbsp;·&nbsp; m minimapa &nbsp;·&nbsp; S zapis &nbsp;·&nbsp; Shift+N nowa gra &nbsp;·&nbsp; klik = idź &nbsp;·&nbsp; <a href="./wielu.html">wielu graczy</a><span id="podpis" hidden></span></p>
  </footer>
</div>

<div id="overlay" hidden>
  <div id="panel"></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
